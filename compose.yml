name: codepier
services:
  hub:
    build: "${CODEPIER_HUB_SOURCE:-.}"
    image: "${CODEPIER_HUB_IMAGE:-codepier:1.33.15}"
    restart: unless-stopped
    init: true
    entrypoint: ["python", "-m", "shared.hub_data_contract", "--exec"]
    command: ["python", "-m", "hub", "run", "--host", "${HUB_HOST:-0.0.0.0}", "--port", "8765"]
    ports:
      - "${HUB_BIND_ADDRESS:-0.0.0.0}:${HUB_PORT:-8765}:8765"
    environment:
      CODEPIER_OIDC_ISSUER: "${CODEPIER_OIDC_ISSUER:-}"
      CODEPIER_OIDC_CLIENT_ID: "${CODEPIER_OIDC_CLIENT_ID:-}"
      CODEPIER_OIDC_CLIENT_SECRET: "${CODEPIER_OIDC_CLIENT_SECRET:-}"
      CODEPIER_OIDC_LABEL: "${CODEPIER_OIDC_LABEL:-SSO}"
      CODEPIER_OIDC_DISCOVERY_URL: "${CODEPIER_OIDC_DISCOVERY_URL:-}"
      CODEPIER_OIDC_SCOPES: "${CODEPIER_OIDC_SCOPES:-openid profile email}"
      CODEPIER_OIDC_GROUP_CLAIM: "${CODEPIER_OIDC_GROUP_CLAIM:-groups}"
      CODEPIER_OIDC_REQUIRED_GROUP: "${CODEPIER_OIDC_REQUIRED_GROUP:-}"
      CODEPIER_OIDC_ENDPOINT_ORIGINS: "${CODEPIER_OIDC_ENDPOINT_ORIGINS:-}"
      CODEPIER_OIDC_FRESHNESS_SECONDS: "${CODEPIER_OIDC_FRESHNESS_SECONDS:-900}"
      CODEPIER_OIDC_ENABLED: "${CODEPIER_OIDC_ENABLED:-true}"
      CODEPIER_OIDC_BOOTSTRAP_ADMIN: "${CODEPIER_OIDC_BOOTSTRAP_ADMIN:-off}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-}"
      CODEPIER_RELAY_BATCH_ENABLED: "${CODEPIER_RELAY_BATCH_ENABLED:-true}"
      CODEPIER_RELAY_BATCH_SHADOW: "${CODEPIER_RELAY_BATCH_SHADOW:-false}"
      CODEPIER_EXPERIENCE_PROJECTION_ENABLED: "${CODEPIER_EXPERIENCE_PROJECTION_ENABLED:-true}"
      CODEPIER_MCP_RESPONSE_BYTES: "${CODEPIER_MCP_RESPONSE_BYTES:-49152}"
      HUB_HOST: "${HUB_HOST:-0.0.0.0}"
      CODEPIER_MCP_GATEWAY: ${CODEPIER_MCP_GATEWAY:-1}
      CODEPIER_LOG_LEVEL: "${CODEPIER_LOG_LEVEL:-info}"
      CODEPIER_FILE_IMPORT_STREAMING: "${CODEPIER_FILE_IMPORT_STREAMING:-true}"
      CODEPIER_NATIVE_FILE_RELAY: "${CODEPIER_NATIVE_FILE_RELAY:-true}"
      CODEPIER_NATIVE_FILE_PROVIDERS: "${CODEPIER_NATIVE_FILE_PROVIDERS:-[]}"
      CODEPIER_KNOWLEDGE_AUTO_ENROLL: "${CODEPIER_KNOWLEDGE_AUTO_ENROLL:-1}"
      CODEPIER_ROOM_HOST_CONNECTIONS_MODE: "${CODEPIER_ROOM_HOST_CONNECTIONS_MODE:-auto}"
      CODEPIER_COLLABORATION_ENABLED: "${CODEPIER_COLLABORATION_ENABLED:-false}"
      CODEPIER_ROOM_CHAT_SCOPE_MODE: "${CODEPIER_ROOM_CHAT_SCOPE_MODE:-strict}"
      CODEPIER_MCP_EVENTS_ENABLED: "${CODEPIER_MCP_EVENTS_ENABLED:-false}"
      CODEPIER_MONITOR_COLLECTOR_ENABLED: "${CODEPIER_MONITOR_COLLECTOR_ENABLED:-false}"
      CODEPIER_ANALYSIS_DISPATCH_ENABLED: "${CODEPIER_ANALYSIS_DISPATCH_ENABLED:-false}"
      CODEPIER_WEIXIN_ENABLED: "${CODEPIER_WEIXIN_ENABLED:-true}"
      CODEPIER_WEIXIN_DELIVERY_ORDER_V2: "${CODEPIER_WEIXIN_DELIVERY_ORDER_V2:-true}"
      CODEPIER_TELEGRAM_ENABLED: "${CODEPIER_TELEGRAM_ENABLED:-false}"
      CODEPIER_WEIXIN_APPROVED_API_BASES: "${CODEPIER_WEIXIN_APPROVED_API_BASES:-}"
      HUB_DATA_DIR: /app/data
      HUB_PANEL_UPDATE_SOCKET: /run/codepier-updater/updater.sock
      HUB_PORT: "8765"
      HUB_PUBLIC_URL: "${HUB_PUBLIC_URL:-http://127.0.0.1:8765}"
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:-${HUB_PUBLIC_URL:-http://127.0.0.1:8765}}"
      HUB_QUEUE_TTL_SECONDS: "${HUB_QUEUE_TTL_SECONDS:-1800}"
      HUB_CALL_WAIT_SECONDS: "${HUB_CALL_WAIT_SECONDS:-10}"
      HUB_DELIVERY_RETRY_SECONDS: "${HUB_DELIVERY_RETRY_SECONDS:-5}"
      MCP_BLOCK_LOCAL_CODEX: "${MCP_BLOCK_LOCAL_CODEX:-false}"
      MCP_BLOCK_NATIVE_COMPUTER: "${MCP_BLOCK_NATIVE_COMPUTER:-false}"
      TZ: "${TZ:-Asia/Taipei}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      OAUTH_REDIRECT_HOSTS: "${OAUTH_REDIRECT_HOSTS:-chatgpt.com,chat.openai.com,platform.openai.com,claude.ai,grok.com,localhost,127.0.0.1,::1}"
    volumes:
      - hub-data:/app/data
      - type: bind
        source: ./.codepier-updater/run
        target: /run/codepier-updater
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  hub-data:
    name: "${CODEPIER_HUB_DATA_VOLUME:-codepier-hub-data}"
    external: true
