# Disposable loopback-only acceptance fixture. No Docker socket or host data mounts.
services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U authentik -d authentik']
      interval: 3s
      retries: 30
    volumes:
      - database:/var/lib/postgresql/data
  server:
    image: ghcr.io/goauthentik/server:2026.8.3
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
    environment: &authentik-environment
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${TEST_DB_PASSWORD:?}
      AUTHENTIK_SECRET_KEY: ${TEST_AUTHENTIK_SECRET:?}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${TEST_BOOTSTRAP_TOKEN:?}
      AUTHENTIK_BOOTSTRAP_PASSWORD_HASH: ${TEST_BOOTSTRAP_HASH:?}
      AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
      AUTHENTIK_DISABLE_UPDATE_CHECK: 'true'
    shm_size: 512mb
    ports:
      - '127.0.0.1:${TEST_AUTHENTIK_PORT:-19000}:9000'
  worker:
    image: ghcr.io/goauthentik/server:2026.8.3
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
    environment: *authentik-environment
    shm_size: 512mb
volumes:
  database:
