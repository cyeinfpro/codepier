# Disposable loopback-only acceptance fixture. No Docker socket or host data mounts.
services:
  postgresql:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U authentik -d authentik']
      interval: 3s
      retries: 30
    volumes:
      - database:/var/lib/postgresql/data
  server:
    image: ghcr.io/goauthentik/server:2026.8.3@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
    environment: &authentik-environment
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${TEST_DB_PASSWORD:?}
      AUTHENTIK_SECRET_KEY: ${TEST_AUTHENTIK_SECRET:?}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${TEST_BOOTSTRAP_TOKEN:?}
      AUTHENTIK_BOOTSTRAP_PASSWORD_HASH: ${TEST_BOOTSTRAP_HASH:?}
      AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
      AUTHENTIK_DISABLE_UPDATE_CHECK: 'true'
    shm_size: 512mb
    ports:
      - '127.0.0.1:${TEST_AUTHENTIK_PORT:-19000}:9000'
  worker:
    image: ghcr.io/goauthentik/server:2026.8.3@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
    environment: *authentik-environment
    shm_size: 512mb
volumes:
  database:
