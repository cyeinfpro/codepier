<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodePier 后台浏览器</title><link rel="stylesheet" href="popup.css"></head><body><header><strong>CodePier</strong><span>后台浏览器</span></header><p id="connection" role="status">读取状态…</p><dl><dt>扩展编号</dt><dd id="extension"></dd><dt>档案编号</dt><dd id="profile"></dd></dl><button id="copy">复制绑定信息</button><section><h2>工作标签页</h2><p id="pool"></p><label>数量 <input id="size" type="number" value="4" min="1" max="16"></label><button id="prepare">准备标签页</button><button id="release">释放全部租约</button><p class="hint">只在你点击后创建。远程调用不创建窗口、不切换前台；你选中的标签页会让出控制。</p></section><section><h2>允许的网站</h2><form id="allow-form"><label for="origin">完整站点地址</label><input id="origin" type="url" placeholder="https://example.com" required><button>授权这个站点</button></form><ul id="origins"></ul><p class="hint">Agent 配置也必须允许同一个站点。不会默认开放全部网站。</p></section><p id="error" role="alert"></p><script type="module" src="popup.js"></script></body></html>
