<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodePier · 改动审阅</title><style>:root{color-scheme:light;--bg:#ffffff;--surface:#fafaf9;--soft:#f0f0f0;--fg:#272727;--muted:#606060;--line:#e6e5e3;--border:#d6d5d2;--accent:#746018;--primary:#f3d970;--primary-text:#29261c;--primary-hover:#e8ce63;--warn:#785b22;--warn-bg:#f7f3e9;--error:#a13c35;--error-bg:#f8efed}
[data-theme=dark]{color-scheme:dark;--bg:#1c1c1b;--surface:#181817;--soft:#2b2b2b;--fg:#e5e5e5;--muted:#b9b9b9;--line:#2c2c2a;--border:#3d3d3a;--accent:#d1bd75;--primary:#d1bd75;--primary-text:#27241b;--primary-hover:#ddcb89;--warn:#d5b77e;--warn-bg:#322e27;--error:#e3a39b;--error-bg:#352b2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;max-width:100%}
main{padding:24px;max-width:100%;min-width:0}
.card{padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);max-width:100%;min-width:0}
p{margin:8px 0;overflow-wrap:anywhere}
h2{font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.02em;margin:10px 0 12px;overflow-wrap:anywhere}
.review-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0 12px;min-width:0}
.review-head h2{margin:0;min-width:0}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted,small{color:var(--muted)}
small{font-size:12px}
.path{font:12px/1.6 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bottom-note{font-size:12px;color:var(--muted);margin:14px 0 0;line-height:1.6}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-width:0}
.chip{display:inline-flex;align-items:center;max-width:100%;min-width:0;font-size:12px;line-height:1.5;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0;min-width:0}
.notice{padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--warn-bg);border-radius:8px;margin:12px 0;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.notice.error{border-left-color:var(--error);background:var(--error-bg);color:var(--error)}
button,summary,input,select{touch-action:manipulation}
button{font:inherit;font-size:13px;font-weight:600;min-height:44px;padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);cursor:pointer;max-width:100%;overflow-wrap:anywhere;transition:background-color 120ms ease,border-color 120ms ease,transform 80ms ease}
button:active:not(:disabled){transform:scale(0.98);border-color:var(--muted);background:var(--soft)}
button[aria-pressed="true"]{border-color:var(--accent);background:var(--warn-bg);color:var(--fg)}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-text);font-weight:700;box-shadow:inset 0 1px 0 rgb(255 255 255 / 35%)}
.primary:active:not(:disabled){transform:scale(0.98);background:var(--primary-hover);border-color:var(--primary-hover)}
button:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:2px}
details{border-bottom:1px solid var(--line);min-width:0;max-width:100%}
summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 4px;cursor:pointer;overflow-wrap:anywhere;min-height:44px;font-size:13px;font-weight:600;border-radius:6px;min-width:0}
summary:active{background:var(--surface)}
summary>span{min-width:0;overflow-wrap:anywhere}
summary>small{margin-left:auto;font-weight:500;flex-shrink:0}
.disclosure-body{padding:4px 0 14px;min-width:0;max-width:100%}
.files{border-top:1px solid var(--line);margin-top:16px;min-width:0;max-width:100%}
.compact-list{padding-left:20px;font-size:12px;line-height:1.7;overflow-wrap:anywhere}
pre{font:12px/1.65 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;white-space:pre;overflow:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;max-height:360px;max-width:100%;background:var(--surface);border:1px solid var(--line);padding:12px 14px;border-radius:8px;margin:8px 0 12px;tab-size:4}
pre.is-wrapped{white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere}
@media (hover: hover) and (pointer: fine){button:hover:not(:disabled){border-color:var(--muted);background:var(--soft)}.primary:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover)}summary:hover{background:var(--surface)}}
@media (max-width: 640px), (pointer: coarse){input,select,textarea{font-size:16px}}
@media (max-width: 540px){main{padding:16px}h2{font-size:20px}}
@media (max-width: 420px){main{padding:10px}.card{padding:12px;border-radius:12px}h2{font-size:18px}.review-head{gap:6px;margin:4px 0 8px}.facts,.toolbar{gap:6px;margin:8px 0}.chip{padding:3px 8px}button{padding:8px 10px;font-size:12px}.wrap-toggle{padding:6px 10px}summary{padding:10px 4px;gap:6px}pre{padding:10px;margin:6px 0 10px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
