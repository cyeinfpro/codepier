name: CodePier CI
run-name: Read-only hosted Ubuntu mirror observation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    name: Read hosted Ubuntu mirror format ${{ matrix.sample }}
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read fixed system mirror file without changing it
        shell: bash
        run: |
          python3 - <<'PYOBSERVE'
          import hashlib, json, os
          from pathlib import Path
          path = Path('/etc/apt/apt-mirrors.txt')
          assert not path.is_symlink() and path.is_file()
          raw = path.read_bytes()
          assert len(raw) <= 4096
          print(json.dumps({'image_os': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'), 'sha256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw), 'content': raw.decode('utf-8')}, ensure_ascii=False))
          PYOBSERVE
