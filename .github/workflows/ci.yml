name: CodePier CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-core:
    name: Windows core, bootstrap and background recovery
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install isolated hash-verified dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --require-hashes -r requirements-dev.txt
      - name: Core pytest (explicit Windows subset, no browser)
        shell: pwsh
        run: |
          $CoreTests = .venv/Scripts/python -c "from tests.classification import WINDOWS_CORE; print('\n'.join('tests/' + name for name in sorted(WINDOWS_CORE)))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pytest -q @CoreTests -m windows_core --strict-markers --junitxml=dist/windows/core.xml --tb=short
      - name: Real PowerShell argument and error behavior
        shell: pwsh
        run: .venv/Scripts/python scripts/check_windows_bootstrap.py --output dist/windows/bootstrap.json
      - name: Real temporary scheduled task recovery
        shell: pwsh
        run: .venv/Scripts/python scripts/check_windows_service.py --output dist/windows/service.json
      - name: Retain Windows evidence (not a complete cross-platform suite)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-core-${{ github.run_id }}
          path: |
            dist/windows/*.xml
            dist/windows/*.json
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: ${{ matrix.shard == 4 && 'Resource admission' || 'Regression' }} ${{ matrix.os }} shard ${{ matrix.shard }} of 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        shard: [0, 1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.work/playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - if: matrix.shard != 4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/mcp-apps/package-lock.json
      - if: matrix.shard != 4
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work/playwright-browsers
          key: browsers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements-dev.txt') }}
      - name: Bound Linux APT download waits
        if: runner.os == 'Linux' && matrix.shard != 4
        timeout-minutes: 2
        shell: bash
        run: |
          # Playwright uses sudo for apt-get; filesystem options survive that boundary.
          # GitHub's zz-retries preset must load before our final timeout values.
          sudo tee /etc/apt/apt.conf.d/zzz-codepier-ci-network >/dev/null <<'APT'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::Retries "2";
          APT
          sudo apt-config dump | grep -Fx 'Acquire::http::Timeout "30";'
          sudo apt-config dump | grep -Fx 'Acquire::https::Timeout "30";'
          sudo apt-config dump | grep -Fx 'Acquire::Retries "2";'
      - name: Fresh environments; cached downloads, never shared virtualenvs
        timeout-minutes: 15
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
          python -m venv .venv-compat
          .venv-compat/bin/python -m pip install --require-hashes -r requirements-compat.txt
          if [[ '${{ matrix.shard }}' != '4' ]]; then
            .venv/bin/python -m playwright install --with-deps chromium webkit
          fi
      - name: macOS standalone Compose validation tool (no daemon)
        if: runner.os == 'macOS' && matrix.shard != 4
        run: |
          if ! docker compose version >/dev/null 2>&1 && ! docker-compose version >/dev/null 2>&1; then
            brew install docker-compose
          fi
          docker compose version || docker-compose version
      - name: Verify reproducible browser build and release inputs
        if: matrix.shard != 4
        run: |
          npm --prefix web/mcp-apps ci --ignore-scripts
          npm --prefix web/mcp-apps run format:check
          npm --prefix web/mcp-apps run build
          .venv/bin/python scripts/build_integration_assets.py
          .venv/bin/python scripts/build_web_assets.py --check
          git diff --exit-code -- web
          .venv/bin/python scripts/check_release.py
      - name: Static and type checks
        if: matrix.shard != 4
        run: |
          .venv/bin/python -m ruff check agent hub shared scripts tests
          .venv/bin/python -m mypy
          git diff --check
      - name: Dependency advisories (one copy per OS)
        if: matrix.shard == 0
        run: |
          .venv/bin/python -m pip_audit --local
          .venv/bin/python -m pip_audit --path .venv-compat/lib/python3.13/site-packages
          npm --prefix web/mcp-apps audit
      - name: Build and bind the public source archive to this commit
        id: archive
        run: |
          VERSION=$(.venv/bin/python -c 'from scripts.build_source_bundle import source_version; print(source_version())')
          .venv/bin/python scripts/build_source_bundle.py --public
          .venv/bin/python scripts/check_release.py --bundle "dist/codepier-$VERSION-source-full.zip" --output dist/public-check.json
          .venv/bin/python scripts/build_source_bundle.py --public --panel-update
          .venv/bin/python scripts/check_release.py --panel-update --bundle "dist/codepier-$VERSION-source.zip" --output dist/panel-update-check.json
          ACCEPTANCE="$RUNNER_TEMP/codepier-public-$GITHUB_RUN_ID-${{ matrix.shard }}"
          BUNDLE="$GITHUB_WORKSPACE/dist/codepier-$VERSION-source-full.zip"
          .venv/bin/python scripts/release_acceptance.py prepare --root "$GITHUB_WORKSPACE" --archive "$BUNDLE" --destination "$ACCEPTANCE" --proof "$GITHUB_WORKSPACE/dist/ci-results/archive-proof.json" --commit "$GITHUB_SHA"
          ln -s "$GITHUB_WORKSPACE/.venv" "$ACCEPTANCE/.venv"
          ln -s "$GITHUB_WORKSPACE/.venv-compat" "$ACCEPTANCE/.venv-compat"
          if [[ '${{ matrix.shard }}' != '4' ]]; then
            ln -s "$GITHUB_WORKSPACE/web/mcp-apps/node_modules" "$ACCEPTANCE/web/mcp-apps/node_modules"
          fi
          echo "root=$ACCEPTANCE" >> "$GITHUB_OUTPUT"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
      - name: Wait for genuine resource-runner readiness
        if: matrix.shard == 4
        timeout-minutes: 7
        env:
          ACCEPTANCE: ${{ steps.archive.outputs.root }}
        run: |
          # Provisioning/indexing can saturate a fresh hosted runner. Wait once
          # before the real workload, never relax admission or retry failed tests.
          cd "$ACCEPTANCE"
          .venv/bin/python scripts/check_resource_readiness.py --timeout 300 --stable-seconds 15
      - name: Exhaustive deterministic shard from the verified public archive
        env:
          ACCEPTANCE: ${{ steps.archive.outputs.root }}
          MCP_COMPAT_PYTHON: ${{ github.workspace }}/.venv-compat/bin/python
        run: |
          cd "$ACCEPTANCE"
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import agent.config, hub.config, tests.support, scripts.regression_plan
          root = Path.cwd().resolve()
          for module in (agent.config, hub.config, tests.support, scripts.regression_plan):
              assert Path(module.__file__).resolve().is_relative_to(root), module.__name__
          PY
          .venv/bin/python scripts/check_full_regression.py --output "$GITHUB_WORKSPACE/dist/ci-results" --workers 2 --timeout 1200 --shard-count 5 --shard-index ${{ matrix.shard }} --resource-shard --coverage
      - name: Verify archive and all extracted public files after regression
        if: always() && steps.archive.outcome == 'success'
        env:
          ACCEPTANCE: ${{ steps.archive.outputs.root }}
          BUNDLE: ${{ steps.archive.outputs.bundle }}
        run: |
          .venv/bin/python scripts/release_acceptance.py finish --root "$ACCEPTANCE" --archive "$BUNDLE" --proof "$GITHUB_WORKSPACE/dist/ci-results/archive-proof.json"
      - name: Retain only selected regression receipts and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-${{ matrix.os }}-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            dist/ci-results/archive-proof.json
            dist/ci-results/summary.json
            dist/ci-results/source-before.json
            dist/ci-results/source-after.json
            dist/ci-results/collection.json
            dist/ci-results/collection.log
            dist/ci-results/markers.json
            dist/ci-results/plan.json
            dist/ci-results/full-regression.xml
            dist/ci-results/coverage.json
            dist/ci-results/coverage.xml
            dist/ci-results/.coverage
            dist/ci-results/*/output.log
            dist/ci-results/*/process.json
            dist/ci-results/*/results.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Retain checked public source archive
        if: matrix.shard == 0 && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-source-${{ matrix.os }}
          path: |
            dist/codepier-*-source*.zip
            dist/codepier-*-source*.manifest.json
            dist/public-check.json
            dist/panel-update-check.json
          if-no-files-found: error
          retention-days: 14

  complete:
    name: Complete evidence ${{ matrix.os }}
    needs: verify
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: regression-${{ matrix.os }}-*
          path: .work/shards
          merge-multiple: false
      - name: Require all shards, exactly-once tests, matching sources and coverage
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
          mapfile -t REPORTS < <(find .work/shards -name summary.json -type f | sort)
          .venv/bin/python scripts/merge_regression.py "${REPORTS[@]}" --coverage --output dist/complete/summary.json
          .venv/bin/python scripts/release_acceptance.py verify --commit "$GITHUB_SHA" --output dist/complete/archive-proof.json "${REPORTS[@]}"
      - name: Changed-statement coverage observation (no legacy global threshold)
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$DIFF_BASE" || "$DIFF_BASE" =~ ^0+$ ]]; then
            DIFF_BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          .venv/bin/python scripts/diff_coverage.py --coverage dist/complete/coverage.json --base "$DIFF_BASE" --output dist/complete/diff-coverage.json
      - name: Retain complete-platform proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complete-${{ matrix.os }}
          path: |
            dist/complete/*.json
            dist/complete/*.xml
          if-no-files-found: error
          retention-days: 14

  oidc-authentik:
    name: Real Authentik OIDC acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Bound Linux APT download waits
        if: runner.os == 'Linux'
        timeout-minutes: 2
        shell: bash
        run: |
          # Playwright uses sudo for apt-get; filesystem options survive that boundary.
          # GitHub's zz-retries preset must load before our final timeout values.
          sudo tee /etc/apt/apt.conf.d/zzz-codepier-ci-network >/dev/null <<'APT'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::Retries "2";
          APT
          sudo apt-config dump | grep -Fx 'Acquire::http::Timeout "30";'
          sudo apt-config dump | grep -Fx 'Acquire::https::Timeout "30";'
          sudo apt-config dump | grep -Fx 'Acquire::Retries "2";'
      - name: Install locked OIDC and browser test tools
        timeout-minutes: 15
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Real isolated provider, two users, OAuth consent and offboarding
        run: .venv/bin/python scripts/check_oidc_authentik.py --output dist/authentik-acceptance.json
      - name: Retain non-secret acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codepier-authentik-${{ github.run_id }}
          path: dist/authentik-acceptance.json
          if-no-files-found: warn
          retention-days: 14
