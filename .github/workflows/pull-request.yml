name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9'
      - run: python scripts/check_host_python.py --smoke
  lightweight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/mcp-apps/package-lock.json
      - name: Install reviewed lock files
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          npm --prefix web/mcp-apps ci --ignore-scripts
      - name: Check source, contracts and generated assets
        run: |
          python -m ruff check agent hub shared scripts tests
          python -m ruff format --check agent hub shared scripts
          python -m mypy
          python scripts/check_dependencies.py
          python scripts/check_repository_contracts.py
          node --test tests/test_lazy_assets.mjs tests/test_diff_html.mjs
          python scripts/sync_standalone_helpers.py --check
          python scripts/update_source_inventory.py --check
          npm --prefix web/mcp-apps run build
          python scripts/build_integration_assets.py
          python scripts/build_web_assets.py --check
          git diff --exit-code -- web
          git diff --check
          python -m pytest -q -m smoke
